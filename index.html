<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis Cuantitativo Financiero — 2do Parcial | Quiz</title>
    <meta name="description" content="Quiz interactivo de Análisis Cuantitativo Financiero para el 2do Parcial. Practica con 299 preguntas de examen.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #0b0d14;
            --surface:   #13162a;
            --surface2:  #1e2240;
            --border:    #282d50;
            --accent:    #6366f1;
            --accent2:   #8b5cf6;
            --glow:      rgba(99,102,241,0.25);
            --success:   #10b981;
            --error:     #ef4444;
            --warning:   #f59e0b;
            --text:      #e2e8f0;
            --muted:     #94a3b8;
            --dim:       #556080;
            --r:         12px;
            --rs:        8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOP BAR ── */
        .topbar {
            background: linear-gradient(90deg, #0f1225 0%, #13162a 100%);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 200;
        }
        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        .brand-logo {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 900; color: white;
            box-shadow: 0 0 16px var(--glow);
        }
        .topbar-stats {
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .tstat {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px;
        }
        .tstat-lbl { color: var(--muted); font-weight: 500; }
        .tstat-val { font-weight: 700; font-size: 14px; }
        .tstat-val.c { color: var(--success); }
        .tstat-val.f { color: var(--error); }
        .tstat-val.p { color: var(--accent); }
        .tstat-sep { color: var(--muted); }

        /* Progress */
        .progress-wrap {
            height: 3px;
            background: var(--border);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2), #ec4899);
            transition: width 0.6s cubic-bezier(.4,0,.2,1);
        }

        /* ── LAYOUT ── */
        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── QUESTION PANEL ── */
        .q-panel {
            flex: 1;
            overflow-y: auto;
            padding: 40px 56px;
        }
        .q-meta {
            font-size: 11px;
            font-weight: 700;
            color: var(--dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 18px;
        }
        .q-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 28px 32px;
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
        }
        .q-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
        }
        .q-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .badge-s { background: rgba(99,102,241,.15); color: #818cf8; border: 1px solid rgba(99,102,241,.3); }
        .badge-m { background: rgba(139,92,246,.15); color: #a78bfa; border: 1px solid rgba(139,92,246,.3); }

        .q-text {
            font-size: 17px;
            font-weight: 500;
            line-height: 1.75;
            color: var(--text);
        }

        /* ── OPTIONS ── */
        .opts {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
        }
        .opt {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 18px;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--rs);
            cursor: pointer;
            transition: border-color .2s, background .2s, transform .15s;
            position: relative;
        }
        .opt:hover:not(.disabled) {
            border-color: var(--accent);
            background: rgba(99,102,241,.06);
            transform: translateX(3px);
        }
        .opt.selected {
            border-color: var(--accent);
            background: rgba(99,102,241,.1);
        }
        .opt.correct {
            border-color: var(--success) !important;
            background: rgba(16,185,129,.1) !important;
            animation: popIn .35s ease;
        }
        .opt.incorrect {
            border-color: var(--error) !important;
            background: rgba(239,68,68,.1) !important;
            animation: shake .35s ease;
        }
        .opt.missed {
            border-color: var(--warning) !important;
            background: rgba(245,158,11,.08) !important;
        }
        .opt.disabled { cursor: default; pointer-events: none; }

        @keyframes popIn {
            0%   { transform: scale(.99); }
            50%  { transform: scale(1.01); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%      { transform: translateX(-5px); }
            60%      { transform: translateX(5px); }
        }

        .opt-icon {
            width: 22px; height: 22px;
            border: 2px solid var(--border);
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 1px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px;
            font-weight: 700;
            transition: all .2s;
        }
        .opt-icon.square { border-radius: 6px; }
        .opt.selected .opt-icon { border-color: var(--accent); background: var(--accent); color: #fff; }
        .opt.correct .opt-icon { border-color: var(--success); background: var(--success); color: #fff; }
        .opt.incorrect .opt-icon { border-color: var(--error); background: var(--error); color: #fff; }
        .opt.missed .opt-icon { border-color: var(--warning); background: var(--warning); color: #fff; }
        .opt-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
        }

        /* ── FEEDBACK ── */
        .feedback {
            border-radius: var(--rs);
            font-size: 13px;
            font-weight: 500;
            padding: 13px 18px;
            margin-bottom: 18px;
            display: none;
            line-height: 1.55;
            animation: slideDown .25s ease;
        }
        .feedback.show { display: block; }
        .feedback.ok  { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
        .feedback.bad { background: rgba(239,68,68,.1);   border: 1px solid rgba(239,68,68,.3);  color: #fca5a5; }

        @keyframes slideDown {
            from { opacity:0; transform: translateY(-6px); }
            to   { opacity:1; transform: translateY(0);    }
        }

        /* ── BUTTONS ── */
        .btns { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 13px 16px;
            border: none; border-radius: var(--rs);
            font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all .2s;
            letter-spacing: .3px;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn-ghost {
            background: var(--surface2);
            color: var(--muted);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { border-color: var(--accent); color: var(--text); }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            box-shadow: 0 4px 18px var(--glow);
        }
        .btn-primary:hover { box-shadow: 0 6px 24px rgba(99,102,241,.55); }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 18px rgba(16,185,129,.3);
            display: none;
        }
        .btn-success.show { display: flex; align-items: center; justify-content: center; gap: 6px; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 216px;
            background: var(--surface);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 14px 0;
            flex-shrink: 0;
        }
        .sb-head {
            padding: 4px 16px 12px;
            font-size: 11px; font-weight: 700; color: var(--dim);
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 6px;
        }
        .sb-items { padding: 0 6px; display: flex; flex-direction: column; gap: 2px; }
        .sb-item {
            padding: 7px 12px;
            border-radius: 7px;
            font-size: 12px; font-weight: 500;
            cursor: pointer;
            transition: all .15s;
            display: flex; align-items: center; gap: 8px;
            color: var(--muted);
        }
        .sb-item:hover { background: var(--surface2); color: var(--text); }
        .sb-item.active  { background: rgba(99,102,241,.15); color: var(--accent); font-weight: 600; }
        .sb-item.ok   { color: var(--success); }
        .sb-item.bad  { color: var(--error); }
        .sb-item.skip { color: var(--warning); }
        .sb-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--border); flex-shrink: 0;
            transition: background .2s;
        }
        .sb-item.active .sb-dot  { background: var(--accent); }
        .sb-item.ok .sb-dot    { background: var(--success); }
        .sb-item.bad .sb-dot   { background: var(--error); }
        .sb-item.skip .sb-dot  { background: var(--warning); }

        /* ── RESULTS ── */
        .results {
            display: none;
            flex: 1;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .results.show { display: flex; }
        .res-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 52px 48px;
            max-width: 560px; width: 100%;
            text-align: center;
            box-shadow: 0 16px 64px rgba(0,0,0,.5);
            position: relative;
            overflow: hidden;
        }
        .res-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent2), #ec4899);
        }
        .res-emoji { font-size: 60px; margin-bottom: 18px; }
        .res-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .res-sub { font-size: 15px; color: var(--muted); margin-bottom: 36px; }
        .res-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 14px; margin-bottom: 36px;
        }
        .res-stat {
            background: var(--surface2);
            border-radius: 12px; padding: 20px 10px;
        }
        .res-stat-v { font-size: 30px; font-weight: 800; margin-bottom: 4px; }
        .res-stat-l { font-size: 12px; color: var(--muted); font-weight: 500; }
        .btn-restart {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff; border: none;
            padding: 14px 36px; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: all .2s;
            box-shadow: 0 4px 20px var(--glow);
        }
        .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,.55); }

        /* scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        @media (max-width: 760px) {
            .sidebar { display: none; }
            .q-panel { padding: 20px 16px; }
            .topbar-stats .tstat:nth-child(n+3) { display: none; }
            .topbar { padding: 0 16px; }
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
    <div class="topbar-brand">
        <div class="brand-logo">D</div>
        ACF — 2do Parcial
    </div>
    <div class="topbar-stats">
        <div class="tstat">
            <span class="tstat-lbl">Cuestión:</span>
            <span class="tstat-val" id="s-idx">1</span>
            <span class="tstat-sep">/</span>
            <span class="tstat-val">299</span>
        </div>
        <div class="tstat">
            <span class="tstat-lbl">Aciertos:</span>
            <span class="tstat-val c" id="s-ok">0</span>
        </div>
        <div class="tstat">
            <span class="tstat-lbl">Fallos:</span>
            <span class="tstat-val f" id="s-bad">0</span>
        </div>
        <div class="tstat">
            <span class="tstat-lbl">Puntos:</span>
            <span class="tstat-val p" id="s-pts">0</span>
        </div>
    </div>
</header>

<div class="progress-wrap">
    <div class="progress-fill" id="prog" style="width:0%"></div>
</div>

<div class="app-body" id="app-body">

    <!-- Question panel -->
    <main class="q-panel">
        <div class="q-meta" id="q-meta">Pregunta 1 de 299</div>

        <div class="q-card">
            <div class="q-badge badge-s" id="q-badge">Única respuesta</div>
            <div class="q-text" id="q-text">Cargando...</div>
        </div>

        <div class="opts" id="opts"></div>

        <div class="feedback" id="feedback"></div>

        <div class="btns">
            <button class="btn btn-ghost" id="btn-skip" onclick="skipQ()">Posponer</button>
            <button class="btn btn-ghost" id="btn-none" onclick="skipQ()">No contestar</button>
            <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()">Contestar</button>
            <button class="btn btn-success" id="btn-next" onclick="nextQ()">Siguiente →</button>
        </div>
    </main>

    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="sb-head">Cuestiones</div>
        <div class="sb-items" id="sb-list"></div>
    </nav>
</div>

<!-- Results -->
<div class="results" id="results">
    <div class="res-card">
        <div class="res-emoji" id="r-emoji">🏆</div>
        <div class="res-title" id="r-title">¡Quiz Completado!</div>
        <div class="res-sub" id="r-sub">Repasá los temas que fallaste.</div>
        <div class="res-grid">
            <div class="res-stat">
                <div class="res-stat-v" style="color:var(--success)" id="r-ok">0</div>
                <div class="res-stat-l">Aciertos</div>
            </div>
            <div class="res-stat">
                <div class="res-stat-v" style="color:var(--error)" id="r-bad">0</div>
                <div class="res-stat-l">Fallos</div>
            </div>
            <div class="res-stat">
                <div class="res-stat-v" style="color:var(--accent)" id="r-pct">0%</div>
                <div class="res-stat-l">Puntuación</div>
            </div>
        </div>
        <button class="btn-restart" onclick="restart()">↺ Repetir Quiz</button>
    </div>
</div>

<script>
const QS = [
  {

  {

let cur = 0, okCnt = 0, badCnt = 0, pts = 0;
let status = new Array(QS.length).fill(null); // null | 'ok' | 'bad' | 'skip'
let sel = new Set();
let done = false;

function init() {
    buildSB();
    show(0);
}

function buildSB() {
    const list = document.getElementById('sb-list');
    list.innerHTML = '';
    QS.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'sb-item';
        d.id = 'sb' + i;
        d.innerHTML = '<div class="sb-dot"></div>Chequear ' + (i+1);
        d.onclick = () => show(i);
        list.appendChild(d);
    });
}

function updateSB() {
    QS.forEach((_, i) => {
        const el = document.getElementById('sb'+i);
        el.className = 'sb-item';
        if (i === cur) el.classList.add('active');
        if (status[i] === 'ok')   el.classList.add('ok');
        if (status[i] === 'bad')  el.classList.add('bad');
        if (status[i] === 'skip') el.classList.add('skip');
    });
    const activeItem = document.getElementById('sb'+cur);
    if (activeItem) {
        const container = document.querySelector('.sidebar');
        // Calculate position to center the item in the sidebar
        const offset = activeItem.offsetTop - (container.clientHeight / 2) + (activeItem.clientHeight / 2);
        container.scrollTo({ top: offset, behavior: 'smooth' });
    }
}

function show(idx) {
    cur = idx;
    const q = QS[idx];
    sel = new Set();
    done = false;

    const badge = document.getElementById('q-badge');
    badge.textContent = q.isMulti ? 'Múltiple respuesta — seleccioná todas las correctas' : 'Única respuesta correcta';
    badge.className = 'q-badge ' + (q.isMulti ? 'badge-m' : 'badge-s');

    document.getElementById('q-meta').textContent = 'Pregunta ' + (idx+1) + ' de ' + QS.length;
    document.getElementById('q-text').textContent = q.question;
    document.getElementById('s-idx').textContent = idx + 1;
    
    // Reset scroll to top
    const qPanel = document.querySelector('.q-panel');
    if (qPanel) qPanel.scrollTop = 0;

    const opts = document.getElementById('opts');
    opts.innerHTML = '';
    q.options.forEach((opt, i) => {
        const d = document.createElement('div');
        d.className = 'opt';
        d.id = 'o'+i;
        d.onclick = () => pick(i, q.isMulti);

        const icon = document.createElement('div');
        icon.className = 'opt-icon' + (q.isMulti ? ' square' : '');
        icon.id = 'ic'+i;

        const txt = document.createElement('div');
        txt.className = 'opt-text';
        txt.textContent = opt;

        d.appendChild(icon);
        d.appendChild(txt);
        opts.appendChild(d);
    });

    const fb = document.getElementById('feedback');
    fb.className = 'feedback';

    document.getElementById('btn-check').style.display = '';
    document.getElementById('btn-skip').style.display = '';
    document.getElementById('btn-none').style.display = '';
    document.getElementById('btn-next').classList.remove('show');

    updateSB();
    updateStats();
}

function pick(i, multi) {
    if (done) return;
    if (!multi) {
        sel.clear();
        document.querySelectorAll('.opt').forEach(el => {
            el.classList.remove('selected');
            el.querySelector('.opt-icon').textContent = '';
        });
    }
    if (sel.has(i)) {
        sel.delete(i);
        document.getElementById('o'+i).classList.remove('selected');
        document.getElementById('ic'+i).textContent = '';
    } else {
        sel.add(i);
        document.getElementById('o'+i).classList.add('selected');
        document.getElementById('ic'+i).textContent = '✓';
    }
}

function norm(s) {
    return s.toLowerCase().replace(/[¿?¡!.,;:\-–]/g,'').replace(/\s+/g,' ').trim();
}

function checkAnswer() {
    if (done) return;
    if (sel.size === 0) { skipQ(); return; }

    const q = QS[cur];
    const selArr = [...sel].map(i => q.options[i]);
    const cn = q.correctAnswers.map(norm);
    const sn = selArr.map(norm);

    const allSelOk = sn.every(s => cn.some(c => c===s || c.includes(s) || s.includes(c)));
    const allOkSel = cn.every(c => sn.some(s => c===s || c.includes(s) || s.includes(c)));
    const isOk = allSelOk && allOkSel;

    done = true;

    document.querySelectorAll('.opt').forEach((el, i) => {
        const on = norm(q.options[i]);
        const isC = cn.some(c => c===on || c.includes(on) || on.includes(c));
        const isS = sel.has(i);
        el.classList.add('disabled');
        el.classList.remove('selected');
        if      (isC &&  isS) { el.classList.add('correct');   document.getElementById('ic'+i).textContent='✓'; }
        else if (!isC && isS) { el.classList.add('incorrect');  document.getElementById('ic'+i).textContent='✗'; }
        else if (isC  && !isS){ el.classList.add('missed');     document.getElementById('ic'+i).textContent='!'; }
    });

    const fb = document.getElementById('feedback');
    if (isOk) {
        fb.className = 'feedback ok show';
        fb.innerHTML = '✅ <strong>¡Correcto!</strong>';
        okCnt++; pts += 10;
        status[cur] = 'ok';
    } else {
        fb.className = 'feedback bad show';
        fb.innerHTML = '❌ <strong>Incorrecto.</strong> Respuesta correcta: <em>' + q.correctAnswers.join(' / ') + '</em>';
        badCnt++; pts = Math.max(0, pts - 5);
        status[cur] = 'bad';
    }

    document.getElementById('btn-check').style.display = 'none';
    document.getElementById('btn-skip').style.display = 'none';
    document.getElementById('btn-none').style.display = 'none';
    document.getElementById('btn-next').classList.add('show');

    updateStats();
    updateSB();
    updateProgress();
}

function skipQ() {
    if (done) { nextQ(); return; }
    status[cur] = 'skip';
    updateSB();
    nextQ();
}

function nextQ() {
    const pending = [];
    for (let i = 0; i < QS.length; i++) {
        if (status[i] === null || status[i] === 'skip') pending.push(i);
    }
    if (pending.length === 0) { showResults(); return; }

    let next = -1;
    for (let i = cur+1; i < QS.length; i++) {
        if (status[i] === null || status[i] === 'skip') { next = i; break; }
    }
    if (next === -1) next = pending[0];
    show(next);
}

function updateStats() {
    document.getElementById('s-ok').textContent  = okCnt;
    document.getElementById('s-bad').textContent = badCnt;
    document.getElementById('s-pts').textContent = pts;
}

function updateProgress() {
    const answered = status.filter(s => s === 'ok' || s === 'bad').length;
    document.getElementById('prog').style.width = (answered / QS.length * 100).toFixed(1) + '%';
}

function showResults() {
    document.getElementById('app-body').style.display = 'none';
    document.getElementById('results').classList.add('show');
    const pct = Math.round(okCnt / QS.length * 100);
    document.getElementById('r-ok').textContent  = okCnt;
    document.getElementById('r-bad').textContent = badCnt;
    document.getElementById('r-pct').textContent = pct + '%';
    if (pct >= 80) {
        document.getElementById('r-emoji').textContent = '🏆';
        document.getElementById('r-title').textContent = '¡Excelente rendimiento!';
        document.getElementById('r-sub').textContent   = 'Dominás el contenido del 2do Parcial.';
    } else if (pct >= 60) {
        document.getElementById('r-emoji').textContent = '📚';
        document.getElementById('r-title').textContent = '¡Buen trabajo!';
        document.getElementById('r-sub').textContent   = 'Seguí repasando los temas flojos.';
    } else {
        document.getElementById('r-emoji').textContent = '💪';
        document.getElementById('r-title').textContent = 'A seguir estudiando';
        document.getElementById('r-sub').textContent   = 'Volvé a practicar hasta dominar el material.';
    }
}

function restart() {
    cur=0; okCnt=0; badCnt=0; pts=0;
    status=new Array(QS.length).fill(null);
    document.getElementById('results').classList.remove('show');
    document.getElementById('app-body').style.display='flex';
    document.getElementById('prog').style.width='0%';
    buildSB(); show(0);
}

init();
</script>
